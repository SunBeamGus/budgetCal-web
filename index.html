<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#123c36" />
    <meta
      name="description"
      content="A private, offline-first budget planner that stores your data on this device."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Budget Cal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Budget Cal</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Budget Cal home">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>
            <strong>Budget Cal</strong>
            <small>Private by default</small>
          </span>
        </a>

        <div class="month-switcher" aria-label="Selected budget month">
          <button class="icon-button" id="previous-month" type="button" aria-label="Previous month">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button class="month-label" id="month-label" type="button" title="Return to this month"></button>
          <button class="icon-button" id="next-month" type="button" aria-label="Next month">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>

        <div class="topbar-actions">
          <button
            class="data-button privacy-button"
            id="privacy-toggle"
            type="button"
            aria-pressed="true"
            title="Show financial statistics"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
            <span id="privacy-toggle-label">Show</span>
          </button>
          <button class="data-button" id="open-data" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 7h16v12H4zM8 3h8l4 4H4l4-4Z" />
              <path d="M8 13h8" />
            </svg>
            <span>Data</span>
          </button>
        </div>
      </header>

      <nav class="tabbar" aria-label="Main navigation">
        <button class="tab-button is-active" type="button" data-tab="overview">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" />
          </svg>
          <span>Overview</span>
        </button>
        <button class="tab-button" type="button" data-tab="budget">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 19V5m0 14h16M8 16v-4m4 4V8m4 8v-6" />
          </svg>
          <span>Budget</span>
        </button>
        <button class="tab-button" type="button" data-tab="assets">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 10 12 4l9 6M5 10v9m4-9v9m6-9v9m4-9v9M3 21h18" />
          </svg>
          <span>Assets</span>
        </button>
        <button class="tab-button" type="button" data-tab="transactions">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h10" />
          </svg>
          <span>Transactions</span>
        </button>
        <button class="tab-button" type="button" data-tab="reports">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 19V9m5 10V5m5 14v-7m5 7V3" />
          </svg>
          <span>Reports</span>
        </button>
      </nav>

      <div class="workspace-bar" id="workspace-bar" hidden>
        <label>
          <span>Workspace</span>
          <select id="workspace-select" aria-label="Active workspace"></select>
        </label>
      </div>

      <div class="access-banner" id="access-banner" hidden></div>

      <main id="app" aria-live="polite">
        <div class="loading-state">
          <span class="loading-mark"></span>
          <p>Opening your local budget…</p>
        </div>
      </main>

      <footer class="app-footer">
        <span id="storage-status">
          <span class="status-dot"></span>
          Stored only on this device
        </span>
        <span id="connection-status">Offline ready</span>
      </footer>
    </div>

    <dialog class="modal" id="modal">
      <div class="modal-header">
        <div>
          <p class="eyebrow" id="modal-eyebrow">Budget Cal</p>
          <h2 id="modal-title">Dialog</h2>
        </div>
        <button class="icon-button modal-close" id="modal-close" type="button" aria-label="Close">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>

    <input id="file-picker" type="file" accept=".json,.csv,application/json,text/csv" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Budget Cal needs JavaScript enabled to manage your local budget.</p>
    </noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
