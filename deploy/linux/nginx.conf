server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://sunbeamgus.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sunbeamgus.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/budget-cal-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/budget-cal/certs/sunbeamgus.top-chain.pem;
    ssl_certificate_key /etc/budget-cal/certs/sunbeamgus.top-key.pem;

    return 308 https://sunbeamgus.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sunbeamgus.top;
    return 301 https://sunbeamgus.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sunbeamgus.top;

    ssl_certificate /etc/budget-cal/certs/sunbeamgus.top-chain.pem;
    ssl_certificate_key /etc/budget-cal/certs/sunbeamgus.top-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sunbeamgus.top;

    ssl_certificate /etc/budget-cal/certs/sunbeamgus.top-chain.pem;
    ssl_certificate_key /etc/budget-cal/certs/sunbeamgus.top-key.pem;

    return 301 https://sunbeamgus.top$request_uri;
}
